spring.application.name=ai-lab

# ===== .env 로드 =====
# .env 는 리포 루트(mafia-ai/.env)에 있고 이 프로젝트는 mafia-ai/ai-lab 이다.
# 작업 디렉터리가 어디든 잡히도록 두 경로를 모두 시도한다. OS 환경변수가 우선한다.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ===== GMS (SSAFY AI 게이트웨이, OpenAI 호환 프록시) =====
# base-url 에 /api.openai.com/v1 까지 필수. SDK 가 /chat/completions 만 덧붙인다.
# 빼면 GMS 가 404 를 반환한다 → docs/LLM호출설정.md §1
spring.ai.openai.base-url=${GMS_BASE:https://gms.ssafy.io/gmsapi}/api.openai.com/v1
spring.ai.openai.api-key=${GMS_KEY}

# ===== 기본 모델 =====
# Spring AI 2.0 은 프로퍼티 경로에 options 단계가 없다 (1.x 는 chat.options.model).
# chat.options.model 로 쓰면 조용히 무시되고 기본 모델로 호출된다 → docs/LLM호출설정.md §2
#
# 기본값은 키워드 뽑기 기준이다. 진술대조·AI 심판은 호출 시 코드에서 gpt-5.4-mini 로 덮어쓴다.
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0

# ===== 토큰 상한을 전역에 두지 않는다 =====
# 두면 gpt-5.x 계열 호출이 전부 깨진다. 호출 시 .options() 로 model 만 덮어써도
# 여기 적힌 max-tokens 가 기본 옵션으로 병합돼 함께 나가는데, gpt-5.x 는
# max_tokens 를 받으면 HTTP 400 이다 (max_completion_tokens 를 써야 한다).
# 게다가 조간신문(500자)과 키워드 뽑기(10자 x 5)를 한 값으로 만족시킬 수 없다.
# → 기능별로 .options() 에서 준다. docs/LLM호출설정.md §4

# 최종 프롬프트를 눈으로 확인할 때 켠다. BeanOutputConverter 가 덧붙이는
# 형식 지시문까지 보인다 → docs/LLM호출설정.md §7
#logging.level.org.springframework.ai=DEBUG
